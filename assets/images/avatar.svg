<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2a781" />
    </linearGradient>
  </defs>

  <!-- Glowing Aura -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGlow)" />
  <circle cx="200" cy="200" r="170" fill="#0f172a" stroke="url(#avatarGrad)" stroke-width="4" />

  <!-- Abstract Dev Grid -->
  <path d="M 50 200 H 350 M 200 50 V 350" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Hoodie -->
  <path d="M 110 350 C 110 280, 140 260, 200 260 C 260 260, 290 280, 290 350 Z" fill="url(#suitGrad)" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 170 260 L 200 300 L 230 260 Z" fill="#3b82f6" opacity="0.3" />

  <!-- Neck -->
  <rect x="185" y="215" width="30" height="40" rx="6" fill="#e2a781" />

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="48" ry="58" fill="url(#faceGrad)" />

  <!-- Modern Hair -->
  <path d="M 148 175 C 145 130, 175 110, 200 110 C 235 110, 255 130, 252 175 C 245 150, 230 145, 200 145 C 170 145, 155 155, 148 175 Z" fill="#1e1b4b" />

  <!-- Tech Glasses -->
  <rect x="160" y="165" width="32" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <rect x="208" y="165" width="32" height="22" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="192" y1="175" x2="208" y2="175" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Glass Reflection -->
  <line x1="164" y1="182" x2="176" y2="170" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="212" y1="182" x2="224" y2="170" stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Smile -->
  <path d="M 188 208 Q 200 216 212 208" stroke="#a25732" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Floating Tech Code Badges -->
  <g transform="translate(60, 110)">
    <rect width="65" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="32" y="18" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/dev&gt;</text>
  </g>
  <g transform="translate(280, 210)">
    <rect width="60" height="28" rx="14" fill="#1e293b" stroke="#ec4899" stroke-width="1.5" />
    <text x="30" y="18" fill="#ec4899" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">{ JS }</text>
  </g>
  <g transform="translate(70, 260)">
    <rect width="60" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="30" y="18" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡ API</text>
  </g>
</svg>
