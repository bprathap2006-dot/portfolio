<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e112a" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg2)" />
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
  <circle cx="45" cy="42" r="5" fill="#ef4444" />
  <circle cx="62" cy="42" r="5" fill="#f59e0b" />
  <circle cx="79" cy="42" r="5" fill="#10b981" />
  <text x="110" y="46" fill="#9ca3af" font-family="monospace" font-size="12">nexus-ai-agent --live</text>

  <!-- Sidebar -->
  <rect x="35" y="65" width="130" height="260" rx="8" fill="#1f2937" />
  <rect x="50" y="80" width="100" height="12" rx="4" fill="#6b7280" opacity="0.7" />
  <rect x="50" y="105" width="80" height="10" rx="3" fill="#4b5563" />
  <rect x="50" y="125" width="90" height="10" rx="3" fill="#4b5563" />
  <rect x="50" y="145" width="70" height="10" rx="3" fill="#4b5563" />

  <!-- Chat / Code Stream -->
  <!-- User message -->
  <rect x="310" y="75" width="240" height="42" rx="10" fill="#374151" />
  <text x="325" y="96" fill="#f3f4f6" font-family="sans-serif" font-size="11">Optimize API cache &amp; generate docs</text>
  <circle cx="560" cy="96" r="10" fill="#6366f1" />

  <!-- AI Response with code block -->
  <circle cx="195" cy="150" r="14" fill="url(#glow2)" />
  <text x="195" y="154" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">AI</text>
  
  <rect x="220" y="135" width="340" height="120" rx="10" fill="#1f2937" stroke="#8b5cf6" stroke-width="1" />
  <rect x="235" y="150" width="220" height="10" rx="4" fill="#a78bfa" />
  <!-- Code snippet preview -->
  <rect x="235" y="170" width="310" height="70" rx="6" fill="#0f172a" />
  <text x="248" y="190" fill="#38bdf8" font-family="monospace" font-size="10">@cache(ttl=3600, key="api:v2")</text>
  <text x="248" y="208" fill="#f43f5e" font-family="monospace" font-size="10">async def <tspan fill="#fbbf24">fetch_metrics</tspan>():</text>
  <text x="268" y="226" fill="#10b981" font-family="monospace" font-size="10">return await db.query(cache_hit=True)</text>

  <!-- Prompt input bar -->
  <rect x="180" y="275" width="380" height="42" rx="21" fill="#1f2937" stroke="#4b5563" />
  <text x="205" y="301" fill="#9ca3af" font-family="sans-serif" font-size="12">Ask Nexus to generate tests or refactor...</text>
  <circle cx="540" cy="296" r="14" fill="#8b5cf6" />
</svg>
