<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg4)" />
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1.5" />
  <circle cx="45" cy="42" r="5" fill="#ef4444" />
  <circle cx="62" cy="42" r="5" fill="#f59e0b" />
  <circle cx="79" cy="42" r="5" fill="#10b981" />
  <text x="110" y="46" fill="#a1a1aa" font-family="monospace" font-size="12">pulse-metrics // cluster-node-01</text>

  <!-- Metric Stat Boxes -->
  <rect x="40" y="65" width="160" height="65" rx="8" fill="#27272a" />
  <text x="55" y="85" fill="#71717a" font-family="sans-serif" font-size="11">RPS (Requests/sec)</text>
  <text x="55" y="115" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="20">14.8k</text>

  <rect x="220" y="65" width="160" height="65" rx="8" fill="#27272a" />
  <text x="235" y="85" fill="#71717a" font-family="sans-serif" font-size="11">Avg Latency</text>
  <text x="235" y="115" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="20">18.4 ms</text>

  <rect x="400" y="65" width="160" height="65" rx="8" fill="#27272a" />
  <text x="415" y="85" fill="#71717a" font-family="sans-serif" font-size="11">Uptime (SLA)</text>
  <text x="415" y="115" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="20">99.99%</text>

  <!-- Main Chart Canvas -->
  <rect x="40" y="145" width="520" height="175" rx="8" fill="#09090b" stroke="#27272a" />
  <!-- Grid Lines -->
  <line x1="55" y1="185" x2="545" y2="185" stroke="#27272a" stroke-dasharray="3 3" />
  <line x1="55" y1="230" x2="545" y2="230" stroke="#27272a" stroke-dasharray="3 3" />
  <line x1="55" y1="275" x2="545" y2="275" stroke="#27272a" stroke-dasharray="3 3" />

  <!-- Area Fill -->
  <path d="M 60 275 Q 120 220, 180 240 T 300 170 T 420 210 T 540 160 L 540 290 L 60 290 Z" fill="url(#chartGrad)" />
  <!-- Chart Line -->
  <path d="M 60 275 Q 120 220, 180 240 T 300 170 T 420 210 T 540 160" fill="none" stroke="#38bdf8" stroke-width="3" />
  <!-- Data Points -->
  <circle cx="180" cy="240" r="4" fill="#38bdf8" />
  <circle cx="300" cy="170" r="5" fill="#67e8f9" stroke="#09090b" stroke-width="2" />
  <circle cx="420" cy="210" r="4" fill="#38bdf8" />
  <circle cx="540" cy="160" r="5" fill="#38bdf8" />
</svg>
