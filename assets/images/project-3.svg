  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg3)" />
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="45" cy="42" r="5" fill="#ef4444" />
  <circle cx="62" cy="42" r="5" fill="#f59e0b" />
  <circle cx="79" cy="42" r="5" fill="#10b981" />
  <rect x="110" y="34" width="180" height="16" rx="8" fill="#1e293b" />

  <!-- E-commerce Navbar -->
  <rect x="40" y="65" width="520" height="35" rx="6" fill="#1e293b" />
  <text x="55" y="87" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="13">HYPER//SHOP</text>
  <rect x="200" y="72" width="160" height="20" rx="10" fill="#334155" />
  <circle cx="535" cy="82" r="10" fill="#10b981" />

  <!-- Product Grid -->
  <!-- Card 1 -->
  <rect x="40" y="115" width="160" height="200" rx="8" fill="#1e293b" stroke="#334155" />
  <rect x="50" y="125" width="140" height="100" rx="6" fill="#334155" />
  <circle cx="120" cy="175" r="30" fill="#0ea5e9" opacity="0.6" />
