  <text x="300" y="296" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">ADD TO CART</text>

  <!-- Card 3 -->
  <rect x="400" y="115" width="160" height="200" rx="8" fill="#1e293b" stroke="#334155" />
  <rect x="410" y="125" width="140" height="100" rx="6" fill="#334155" />
  <circle cx="480" cy="175" r="30" fill="#a855f7" opacity="0.6" />
  <rect x="412" y="235" width="110" height="10" rx="3" fill="#f1f5f9" />
  <rect x="412" y="252" width="50" height="8" rx="2" fill="#10b981" />
  <rect x="412" y="280" width="136" height="24" rx="4" fill="#334155" />
  <text x="480" y="296" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">ADD TO CART</text>
