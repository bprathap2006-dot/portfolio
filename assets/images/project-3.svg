  <text x="120" y="296" fill="#0f172a" font-family="sans-serif" font-weight="bold" font-size="10" text-anchor="middle">ADD TO CART</text>

  <!-- Card 2 -->
  <rect x="220" y="115" width="160" height="200" rx="8" fill="#1e293b" stroke="#334155" />
  <rect x="230" y="125" width="140" height="100" rx="6" fill="#334155" />
  <circle cx="300" cy="175" r="30" fill="#f43f5e" opacity="0.6" />
  <rect x="232" y="235" width="95" height="10" rx="3" fill="#f1f5f9" />
  <rect x="232" y="252" width="65" height="8" rx="2" fill="#10b981" />
